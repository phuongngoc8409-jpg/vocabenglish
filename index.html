.b1{background:#e6f1fd}.b1 h5{color:#1a5490}.b2{background:#eaf4df}.b2 h5{color:#3b6d11}.b3{background:#fceaea}.b3 h5{color:#a32d2d}.b4{background:#fbebe6}.b4 h5{color:#993c1d}

<header id="hd"></header><main id="main"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='vocab12_v1',uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toLocaleDateString('sv'),shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const F=[['en','Từ tiếng Anh *'],['vi','Nghĩa tiếng Việt *'],['type','Loại từ'],['ipa','IPA'],['e1','Ví dụ 1'],['e2','Ví dụ 2'],['syn','Đồng nghĩa'],['ant','Trái nghĩa'],['col','Collocations (cụm = nghĩa; cụm = nghĩa)'],['cefr','CEFR']];
const MODES=[['flash','Flashcard SRS','🃏','Ôn tập ngắt quãng kiểu Anki'],['match','Ghép thẻ','🧩','Ghép Anh ↔ Việt, tối đa 12 từ'],['quiz','Trắc nghiệm','✅','Chọn nghĩa tiếng Việt đúng'],['write','Tự viết','✍️','Nhìn nghĩa, gõ từ tiếng Anh'],['speed','Phản xạ nhanh','⚡','4 đáp án, 5 giây mỗi câu'],['lsent','Nghe chép câu','🎧','Nghe câu ví dụ và gõ lại'],['fill','Điền khuyết','🔤','Điền phần chữ bị che'],['lword','Nghe chép từ','👂','Nghe và gõ lại từ']];
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.topics)return d}catch(e){}return{topics:[],words:[],cur:null,goal:30,daily:{},fc:{}}})();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(typeof qs=='function')qs()};const mk=(tid,o)=>({id:uid(),tid,...o,reps:0,ease:2.5,ivl:0,due:0,step:0,added:Date.now()});
function ensure(){if(!S.topics.length){const t={id:uid(),name:'Bài 1'};S.topics.push(t);S.cur=t.id;if(!S.words.length)[['achieve','đạt được','v','/əˈtʃiːv/','She achieved her goal.','','accomplish','fail','achieve success','B1'],['sustainable','bền vững','adj','/səˈsteɪnəbl/','We need sustainable energy.','','durable','','sustainable development','B2'],['consequence','hậu quả','n','/ˈkɒnsɪkwəns/','Every action has a consequence.','','result','cause','face the consequences','B1'],['enthusiastic','nhiệt tình','adj','/ɪnˌθjuːziˈæstɪk/','He is enthusiastic about music.','','eager','indifferent','be enthusiastic about','B2']].forEach(a=>S.words.push(mk(t.id,Object.fromEntries(F.map(([k],i)=>[k,a[i]])))))}if(S.cur!='all'&&!S.topics.find(t=>t.id==S.cur))S.cur=S.topics[0].id}
const wordsOf=()=>S.cur=='all'?S.words:S.words.filter(w=>w.tid==S.cur);
let tab='learn',G=null,DC=0,Q='',SORT='new',SC='cur',EDIT=null,SHOWF=0,MO=new Date(),X=new Set(),tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
const sure=m=>{if(DC)return DC=0,true;DC=1;toast(m+' – bấm lần nữa để xác nhận');setTimeout(()=>DC=0,3000);return false};
/* audio */
let AC;function tone(f,d,t='sine',v=.15,at=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const snd={ok:()=>{tone(660,.12);tone(880,.2,'sine',.15,.1)},no:()=>tone(180,.3,'sawtooth',.1),ps:()=>[523,659,784].forEach((f,i)=>tone(f,.2,'sine',.15,i*.15)),pe:()=>[0,.4,.8].forEach(a=>tone(1046,.35,'sine',.2,a)),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12))};
function speak(t){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1;speechSynthesis.speak(u)}
const say=id=>speak(S.words.find(w=>w.id==id)?.en);
function confetti(){const c=$('#cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const p=[...Array(130)].map(()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*18,vy:-Math.random()*17-4,s:5+Math.random()*6,c:`hsl(${Math.random()*360},85%,60%)`,l:100}));(function f(){x.clearRect(0,0,c.width,c.height);let a=0;p.forEach(q=>{if(q.l<=0)return;a=1;q.x+=q.vx;q.y+=q.vy;q.vy+=.35;q.l--;x.globalAlpha=Math.min(1,q.l/30);x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s*.6)});if(a)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
/* nav */
const TABS=[['learn','Học'],['words','Từ vựng'],['stats','Tiến độ'],['pomo','Pomodoro'],['io','Nhập/Xuất']];
function go(t){tab=t;if(G)clearInterval(G.tm),clearTimeout(G.adv);G=null;render()}
const IC={learn:'🏠',words:'📖',stats:'📈',pomo:'🍅',io:'🔁'};
function render(){ensure();save();
$('#hd').innerHTML=`<div class="logo">📚<span> Vocab<b></b></span></div><nav>${TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><em>${IC[k]}</em><span>${l}</span></button>`).join('')}</nav><div class="hr"><select onchange="S.cur=this.value;go(tab)">${S.topics.map(t=>`<option value="${t.id}" ${S.cur==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}<option value="all" ${S.cur=='all'?'selected':''}>Tất cả bài</option></select><details class="mn"><summary>⚙️</summary><div><input id="nt" placeholder="Tên bài mới"><button class="sm" onclick="addT()">＋ Thêm bài</button><button class="sm" onclick="renT()">✏️ Đổi tên</button><button class="sm" onclick="delT()">🗑 Xóa bài</button></div></details><span class="chip">🔥 ${streak()}</span></div>`;
$('#main').innerHTML={learn:vLearn,words:vWords,stats:vStats,pomo:vPomo,io:vIO}[tab]();if(tab=='words'){list();fit()}if(tab=='io')ioOut()}
function addT(){const n=$('#nt').value.trim();if(!n)return toast('Nhập tên bài học');const t={id:uid(),name:n};S.topics.push(t);S.cur=t.id;render()}
function delT(){if(S.cur=='all')return toast('Hãy chọn một bài cụ thể');if(!sure('Xóa bài và toàn bộ từ trong bài'))return;S.words=S.words.filter(w=>w.tid!=S.cur);S.topics=S.topics.filter(t=>t.id!=S.cur);S.cur=null;go(tab)}
/* learn home */
const dueL=()=>wordsOf().filter(w=>w.due<=Date.now());
function vLearn(){const d=S.daily[today()]||0,p=Math.min(100,Math.round(d/S.goal*100));
return`<div class="chips"><span>🔥 ${streak()} ngày</span><span>🃏 ${dueL().length} thẻ ôn</span><span>📚 ${wordsOf().length} từ</span><div class="gl">🎯 ${d}/${S.goal}<div class="bar"><i style="width:${p}%"></i></div>${p}%</div></div><div class="grid">${MODES.map(m=>`<button class="mode" onclick="start('${m[0]}')"><em>${m[2]}</em><b>${m[1]}</b><span>${m[3]}</span></button>`).join('')}</div>`}
/* stats */
function streak(){let n=0,d=new Date();if(!S.daily[today()])d.setDate(d.getDate()-1);while((S.daily[d.toLocaleDateString('sv')]||0)>0){n++;d.setDate(d.getDate()-1)}return n}
function vStats(){const d=S.daily[today()]||0,p=Math.min(100,Math.round(d/S.goal*100)),y=MO.getFullYear(),m=MO.getMonth(),n=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;let c='';for(let i=0;i<off;i++)c+='<span></span>';for(let i=1;i<=n;i++){const k=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,v=S.fc[k]||0;c+=`<i class="${v>50?'c3':v>=20?'c2':v>0?'c1':''}" title="${k}: ${v} thẻ">${i}</i>`}
return`<div class="card"><h3>🎯 Mục tiêu hằng ngày</h3><div class="tb">Mục tiêu: <input type="number" min="1" value="${S.goal}" style="width:90px" onchange="S.goal=Math.max(1,+this.value||30);render()"> lượt/ngày</div><p>Đã học hôm nay: <b>${d}</b> · Hoàn thành <b>${p}%</b></p><div class="bar d"><i style="width:${p}%"></i></div></div><div class="card"><div class="rowb"><h3>🔥 Streak: ${streak()} ngày</h3><div class="tb"><button class="sm" onclick="MO.setMonth(MO.getMonth()-1);render()">‹</button><b>Tháng ${m+1}/${y}</b><button class="sm" onclick="MO.setMonth(MO.getMonth()+1);render()">›</button></div></div><div class="hm" style="margin:12px 0"><small class="mu">T2</small><small class="mu">T3</small><small class="mu">T4</small><small class="mu">T5</small><small class="mu">T6</small><small class="mu">T7</small><small class="mu">CN</small>${c}</div></div>`}
/* SRS */
function rate(w,r){const n=Date.now(),M=6e4,D=864e5,st=[1,10];
if(w.step>=0){if(r==0){w.step=0;w.due=n+M}else if(r==1)w.due=n+(w.step?10:6)*M;else if(r==2){w.step++;if(w.step>=2){w.step=-1;w.ivl=Math.max(1,w.ivl);w.due=n+w.ivl*D}else w.due=n+st[w.step]*M}else{w.step=-1;w.ivl=Math.max(4,w.ivl);w.due=n+w.ivl*D}}
else{if(r==0){w.ease=Math.max(1.3,w.ease-.2);w.ivl=Math.max(1,Math.round(w.ivl*.5));w.step=0;w.due=n+M}else{if(r==1){w.ivl=Math.max(w.ivl+1,Math.round(w.ivl*1.2));w.ease=Math.max(1.3,w.ease-.15)}else if(r==2)w.ivl=Math.max(w.ivl+1,Math.round(w.ivl*w.ease));else{w.ivl=Math.max(w.ivl+1,Math.round(w.ivl*w.ease*1.3));w.ease+=.15}w.due=n+w.ivl*D}}
if(r>0)w.reps++}
const fmtI=ms=>ms<36e5?Math.max(1,Math.round(ms/6e4))+' phút':ms<864e5?Math.round(ms/36e5)+' giờ':Math.round(ms/864e5)+' ngày';
function flash(){const n=Date.now(),ws=wordsOf(),q=ws.filter(w=>w.due<=n),o=q.filter(w=>w.due).sort((a,b)=>a.due-b.due),nw=q.filter(w=>!w.due).slice(0,20),L=ws.filter(w=>w.step>=0&&w.due>n&&w.due-n<12e5).sort((a,b)=>a.due-b.due);G={m:'flash',q:[...o,...nw],L,flip:0};fShow()}const fTags=w=>`<div class="ft">${w.type?`<span class="t1">${esc(w.type)}</span>`:''}${w.cefr?`<span class="t2">${esc(w.cefr)}</span>`:''}</div>`;
const fRate=(w,on)=>!on?'':`<div class="rt2">${['Again','Hard','Good','Easy'].map((x,i)=>{let t='';if(on){const c={...w};rate(c,i);t=`<small>${fmtI(c.due-Date.now())}</small>`}return`<button class="r${i}" ${on?'':'disabled'} onclick="rateQ(${i})">${x}${t}</button>`}).join('')}</div>`;function fShow(){clearInterval(G.tm);if(G.L.length&&G.L[0].due<=Date.now())G.q.unshift(G.L.shift());if(!G.q.length&&G.L.length)return fWait();const w=G.q[0];if(!w){G=null;$('#main').innerHTML='<div class="card ctr"><h2>🎉 Đã ôn xong!</h2><p class="mu">Quay lại sau để ôn các thẻ tiếp theo.</p><button class="btn" onclick="go(\'learn\')">Về trang chủ</button></div>';return snd.win()}
G.flip=0;G.say=w.en;$('#main').innerHTML=`<div class="rowb"><span class="mu">Còn ${G.q.length+G.L.length} thẻ</span><button class="sm" onclick="go('learn')">Thoát</button></div><div class="card fc" onclick="G.flip?unflip():flip()">${fTags(w)}<div class="big"><span class="bw">${esc(w.en)}<button class="sm sp" onclick="event.stopPropagation();speak(G.say)">🔊</button></span></div><div class="mu"><i>${esc(w.ipa)}</i></div><div id="bk"></div></div><div id="ac">${fRate(w,0)}</div>`;speak(w.en)}
const pp=t=>(t||'').split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('=');return i<0?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]});
const pg=a=>a.length?`<div class="cg">${a.map(c=>`<span>• ${esc(c[0])}</span><span>${esc(c[1])}</span>`).join('')}</div>`:'<p>—</p>';
function flip(){const w=G.q[0];if(!w||!$('#bk'))return;G.flip=1;const ex=[w.e1,w.e2].filter(Boolean),cl=(w.col||'').split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('=');return i<0?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]});
$('#bk').innerHTML=`<div class="bm">${esc(w.vi)}</div>${ex.length?`<div class="bx b1"><h5>📝 Ví dụ</h5>${ex.map(e=>`<p>• ${esc(e)}</p>`).join('')}</div>`:''}<div class="two"><div class="bx b2"><h5>Đồng nghĩa</h5>${pg(pp(w.syn))}</div><div class="bx b3"><h5>Trái nghĩa</h5>${pg(pp(w.ant))}</div></div>${cl.length?`<div class="bx b4"><h5>🔗 Collocation / cụm từ</h5><div class="cg">${cl.map(c=>`<span>• ${esc(c[0])}</span><span>${esc(c[1])}</span>`).join('')}</div></div>`:''}`;
$('#ac').innerHTML=fRate(w,1)}
function fWait(){G.flip=0;const t=G.L[0].due,draw=()=>{const s=Math.max(0,Math.ceil((t-Date.now())/1000)),e=$('#wt');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(G.tm);fShow()}};$('#main').innerHTML=`<div class="rowb"><span class="mu">Đang chờ thẻ học lại</span><button class="sm" onclick="go('learn')">Thoát</button></div><div class="card ctr"><h3>⏳ Thẻ tiếp theo sau</h3><div class="pt" id="wt"></div><p class="mu">Còn ${G.L.length} thẻ đang chờ đến giờ ôn lại.</p><button class="btn g" onclick="G.q.unshift(G.L.shift());fShow()">Học ngay, không chờ</button></div>`;draw();G.tm=setInterval(draw,500)}

function rateQ(r){const w=G.q.shift();rate(w,r);const t=today();S.daily[t]=(S.daily[t]||0)+1;S.fc[t]=(S.fc[t]||0)+1;if(w.due-Date.now()<12e5){G.L.push(w);G.L.sort((a,b)=>a.due-b.due)}save();fShow()}

function match(){const ws=shuf(wordsOf()).slice(0,12);G={m:'match',sel:null,left:ws.length,t:shuf(ws.flatMap(w=>[{k:w.id,t:'en',x:w.en},{k:w.id,t:'vi',x:w.vi}]))};mDraw()}

function mPick(i){const c=G.t[i];if(c.m)return;if(c.t=='en')speak(c.x);if(!G.sel||G.sel==c){G.sel=G.sel==c?null:c;return mDraw()}const a=G.sel;G.sel=null;if(a.k==c.k&&a.t!=c.t){a.m=c.m=1;G.left--;snd.ok();rec(1);mDraw();if(!G.left){snd.win();confetti();toast('🎉 Hoàn thành ván!')}}else{snd.no();rec(0);mDraw();const b=document.querySelectorAll('.tile');[a,c].forEach(z=>b[G.t.indexOf(z)].classList.add('w'));}}

function start(m){const ws=wordsOf();if(!ws.length)return toast('Bài học chưa có từ');if(m=='flash')return flash();if(m=='match')return match();if((m=='quiz'||m=='speed')&&ws.length<4)return toast('Cần ít nhất 4 từ');const pool=m=='lsent'?ws.filter(w=>w.e1||w.e2):ws;if(!pool.length)return toast('Chưa có câu ví dụ');G={m,qs:shuf(pool).slice(0,20),i:0,ok:0,no:0,st:0,res:[]};nextQ()}
const norm=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim();
function nextQ(){clearInterval(G.tm);if(G.i>=G.qs.length)return endG();const w=G.qs[G.i],m=G.m,ws=wordsOf();G.ans=0;G.say=null;let pr='',body='';
const ch=(list,k)=>{G.c=shuf([k,...shuf([...new Set(list)].filter(x=>x!=k)).slice(0,3)]);return`<div class="opts">${G.c.map((x,i)=>`<button class="opt" onclick="pick(${i})"><kbd>${i+1}</kbd>${esc(x)}</button>`).join('')}</div>`};
const inp=ph=>`<input id="ai" class="ai" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ph}" onkeydown="if(event.key=='Enter'){event.preventDefault();submit()}"><div class="ctr"><button class="btn" onclick="submit()">Kiểm tra</button></div>`;
if(m=='quiz'){G.key=w.vi;G.say=w.en;pr=`<div class="big">${esc(w.en)}</div><div class="mu">${esc(w.type)} ${esc(w.ipa)}</div>`;body=ch(ws.map(x=>x.vi),w.vi)}
else if(m=='speed'){G.key=w.en;pr=`<div class="big">${esc(w.vi)}</div><div class="bar d"><i id="tb" style="width:100%"></i></div>`;body=ch(ws.map(x=>x.en),w.en);G.t=5000;G.tm=setInterval(()=>{G.t-=50;const b=$('#tb');if(b)b.style.width=G.t/50+'%';if(G.t<=0)settle(0)},50)}
else if(m=='write'){G.key=w.en;pr=`<div class="big">${esc(w.vi)}</div><div class="mu">${esc(w.type)}</div>`;body=inp('Nhập từ tiếng Anh')}
else if(m=='lsent'){G.key=w.e1&&w.e2?(Math.random()<.5?w.e1:w.e2):w.e1||w.e2;G.say=G.key;pr=`<div class="big">🎧</div><div class="mu">Nghe và chép lại câu · <button class="sm" onclick="speak(G.say)">🔊 Nghe lại (Alt)</button></div>`;body=inp('Gõ lại câu bạn nghe')}
else if(m=='fill'){const n=w.en.length,k=Math.max(1,Math.round(n/3)),s=Math.random()*(n-k+1)|0;G.key=w.en.slice(s,s+k);G.say=w.en;pr=`<div class="big" style="letter-spacing:4px">${esc(w.en.slice(0,s))}<span style="color:var(--pr)">${'_'.repeat(k)}</span>${esc(w.en.slice(s+k))}</div><div class="mu">${esc(w.vi)}</div>`;body=inp('Nhập phần bị thiếu')}
else{G.key=w.en;G.say=w.en;pr=`<div class="big">👂</div><div class="mu">Nghe và gõ lại từ · <button class="sm" onclick="speak(G.say)">🔊 Nghe lại (Alt)</button></div>`;body=inp('Nhập từ tiếng Anh')}
$('#main').innerHTML=`<div class="rowb"><span>Câu ${G.i+1}/${G.qs.length} · ✔${G.ok} ✘${G.no} · 🔥${G.st}</span><button class="sm" onclick="go('learn')">Thoát</button></div><div class="bar d" style="margin:8px 0 16px"><i style="width:${G.i/G.qs.length*100}%"></i></div><div class="card">${pr}${body}<div class="fb" id="fb"></div></div><div class="tb" style="justify-content:center;gap:20px"><button class="btn g" onclick="backQ()"> ◀ </button><button class="btn g" onclick="skipN()"> ▶ </button></div>`;
if(G.say&&m!='quiz')speak(G.say);if(m=='quiz')speak(w.en);const a=$('#ai');if(a)a.focus()}
function pick(i){if(G.ans||G.c==null||i>=G.c.length)return;settle(G.c[i]==G.key,i)}
function submit(){if(G.ans)return adv();const v=$('#ai').value;if(!v.trim())return settle(false);settle(norm(v)==norm(G.key))}
function settle(ok,idx){if(G.ans)return;G.ans=1;clearInterval(G.tm);const isC=['quiz','speed'].includes(G.m);const f1=G.res[G.i]===undefined;G.res[G.i]=ok;G.ok=G.res.filter(x=>x===true).length;G.no=G.res.filter(x=>x===false).length;if(ok){G.st++;snd.ok()}else{G.st=0;snd.no()}if(f1)rec(ok);
if(isC)document.querySelectorAll('.opt').forEach((b,j)=>{if(G.c[j]==G.key)b.classList.add('ok');else if(j===idx)b.classList.add('no')});
$('#fb').innerHTML=ok?'<span class="ok-t">✔ Chính xác!</span>':`<span class="no-t">✘ Đáp án: ${esc(G.key)}</span>`;if(G.m=='speed'&&!ok&&idx==null)$('#fb').innerHTML='<span class="no-t">⏰ Hết giờ! Đáp án: '+esc(G.key)+'</span>';
if(ok&&G.st%5==0){confetti();snd.win()}
G.adv=setTimeout(adv,ok?1000:5000)}

function endG(){const g=G,p=Math.round(g.ok/g.qs.length*100);if(p>=80){confetti();snd.win()}$('#main').innerHTML=`<div class="card ctr"><h2>Kết quả: ${g.ok}/${g.qs.length} (${p}%)</h2><p class="mu">Đúng ${g.ok} · Sai ${g.no} · Chưa làm ${g.qs.length-g.ok-g.no}</p><div class="tb" style="justify-content:center"><button class="btn" onclick="start('${g.m}')">Chơi lại</button><button class="btn g" onclick="go('learn')">Về trang chủ</button></div></div>`;G=null}
document.addEventListener('keydown',e=>{const inp=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);if(e.key=='Alt'&&!e.repeat&&G&&G.say){e.preventDefault();return speak(G.say)}if(G&&G.qs&&(e.key=='End'||e.key=='Home')){e.preventDefault();return e.key=='End'?skipN():backQ()}if(inp||!G)return;

function saveW(){const o={};F.forEach(([k])=>o[k]=$('#f_'+k).value.trim());const tid=$('#f_tid').value;if(!o.en||!o.vi)return toast('Cần nhập từ và nghĩa');if(S.words.some(w=>w.tid==tid&&w.id!=EDIT&&w.en.toLowerCase()==o.en.toLowerCase()))return toast('Từ đã tồn tại trong bài này');if(EDIT)Object.assign(S.words.find(w=>w.id==EDIT),o,{tid});else S.words.push(mk(tid,o));EDIT=null;SHOWF=0;render()}

/* pomodoro */
let PM={m:'f',f:25,left:1500,run:0,tm:0};const mmss=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pUp(){const a=$('#pt');if(a)a.textContent=mmss(PM.left);const b=$('#pl');if(b)b.textContent=PM.m=='f'?'📖 Đang học':'☕ Nghỉ 5 phút'}

function cp(t){try{navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép'),()=>toast('Hãy copy thủ công'))}catch(e){toast('Hãy copy thủ công')}}
function dl(){ioOut();const t=$('#eo').value;if(!t)return toast('Chưa chọn từ nào');try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='vocab-export.txt';a.click()}catch(e){}toast('Nếu file không tải được, hãy dùng nút Sao chép')}
function doImp(){if(S.cur=='all')return $('#ir').textContent='Hãy chọn một bài cụ thể ở thanh trên.';let ok=0,sk=0;$('#imp').value.split('\n').forEach(l=>{l=l.trim();if(!l||l.startsWith('#'))return;const p=l.split('|').map(s=>s.trim()),o=Object.fromEntries(F.map(([k],i)=>[k,p[i]||'']));if(!o.en||!o.vi||o.en.toLowerCase()=='english'||S.words.some(w=>w.tid==S.cur&&w.en.toLowerCase()==o.en.toLowerCase()))return sk++;S.words.push(mk(S.cur,o));ok++});save();$('#ir').textContent=`✅ Thêm thành công ${ok} từ · bỏ qua ${sk} dòng (thiếu dữ liệu/trùng).`}
const FB='https://voca-3a3d7-default-rtdb.asia-southeast1.firebasedatabase.app/vocab12/';
const gsc=()=>{try{return localStorage.getItem('v12sc')||''}catch(e){return ''}};
let SY={code:gsc(),last:'',busy:0,tm:0};
const snap=()=>{const{ts,...r}=S;return JSON.stringify(r)};
function qs(){if(SY.code&&snap()!==SY.last){clearTimeout(SY.tm);SY.tm=setTimeout(autoSync,3000)}}
async function autoSync(){if(!SY.code||SY.busy)return;SY.busy=1;
try{const u=FB+encodeURIComponent(SY.code)+'.json',cur=snap();let d=null;
if(!G&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){const r=await fetch(u);if(r.ok)d=await r.json()}
const rts=d&&d.topics?(d.ts||0):0;
if(rts>(S.ts||0)&&(SY.last===''||cur===SY.last)){S={goal:30,daily:{},fc:{},words:[],...d};SY.last=snap();save();render();toast('🔄 Đã cập nhật từ thiết bị khác')}
else if(cur!==SY.last){S.ts=Date.now();SY.last=snap();save();await fetch(u,{method:'PUT',body:JSON.stringify(S)})}
}catch(e){}SY.busy=0}
function syOn(){const c=($('#sc').value||'').trim();if(c.length<8)return toast('Mã tối thiểu 8 ký tự');try{localStorage.setItem('v12sc',c)}catch(e){}SY.code=c;SY.last='';autoSync().then(()=>{toast('🔄 Đã bật đồng bộ tự động');render()})}
function syOff(){SY.code='';try{localStorage.removeItem('v12sc')}catch(e){}toast('Đã tắt đồng bộ');render()}
function vSY(){return`<div class="card"><h3>🔄 Đồng bộ tự động (Firebase)</h3><p class="mu">${SY.code?'🟢 Đang bật: dữ liệu tự đẩy lên sau mỗi thay đổi và tự cập nhật khi mở lại trang.':'⚪ Chưa bật. Nhập cùng một mã trên mọi thiết bị rồi bấm Bật.'}</p><div class="tb"><input id="sc" placeholder="Mã đồng bộ (≥ 8 ký tự)" value="${esc(gsc())}"><button class="btn" onclick="syOn()">Bật đồng bộ</button><button class="btn g" onclick="syOff()">Tắt</button></div></div>`}
setInterval(autoSync,30000);
addEventListener('visibilitychange',()=>{if(!document.hidden)autoSync()});addEventListener('online',autoSync);
setTimeout(autoSync,1500);
function pv(id){const w=S.words.find(x=>x.id==id);if(!w)return;const ex=[w.e1,w.e2].filter(Boolean);let o=$('#ov');if(!o){o=document.createElement('div');o.id='ov';o.onclick=pvX;document.body.appendChild(o)}
o.innerHTML=`<div class="ovb" onclick="event.stopPropagation()"><div class="rowb" style="margin-bottom:8px"><b>👁️ Xem trước thẻ</b><button class="sm" onclick="pvX()">✕ Đóng</button></div><div class="card fc" style="cursor:default;margin:0">${fTags(w)}<div class="big"><span class="bw">${esc(w.en)}<button class="sm sp" onclick="say('${w.id}')">🔊</button></span></div><div class="mu"><i>${esc(w.ipa)}</i></div><div class="bm">${esc(w.vi)}</div>${ex.length?`<div class="bx b1"><h5>📝 Ví dụ</h5>${ex.map(e=>`<p>• ${esc(e)}</p>`).join('')}</div>`:''}<div class="two"><div class="bx b2"><h5>Đồng nghĩa</h5>${pg(pp(w.syn))}</div><div class="bx b3"><h5>Trái nghĩa</h5>${pg(pp(w.ant))}</div></div>${pp(w.col).length?`<div class="bx b4"><h5>🔗 Collocation / cụm từ</h5>${pg(pp(w.col))}</div>`:''}</div></div>`;o.style.display='flex'}
function pvX(){const o=$('#ov');if(o)o.style.display='none'}
addEventListener('keydown',e=>{if(e.key=='Escape')pvX()});
function fit(){document.querySelectorAll('.fg textarea').forEach(t=>{t.style.height='auto';t.style.height=(t.scrollHeight+t.offsetHeight-t.clientHeight)+'px'})}
addEventListener('resize',fit);
function renT(){if(S.cur=='all')return toast('Hãy chọn một bài cụ thể');const n=$('#nt').value.trim();if(!n)return toast('Nhập tên mới vào ô trên rồi bấm Đổi tên');const t=S.topics.find(x=>x.id==S.cur);if(t){t.name=n;render();toast('✅ Đã đổi tên bài')}}
function skipN(){if(!G||!G.qs)return;clearInterval(G.tm);clearTimeout(G.adv);if(!G.ans&&G.res[G.i]===undefined&&['write','fill','lsent','lword'].includes(G.m)){G.res[G.i]=false;rec(0);G.ok=G.res.filter(x=>x===true).length;G.no=G.res.filter(x=>x===false).length;G.st=0;toast('⏭ Bỏ qua – tính sai. Đáp án: '+(G.m=='fill'?G.say:G.key))}G.i++;nextQ()}
function backQ(){if(!G||!G.qs)return;if(G.i<=0)return toast('Đây là từ đầu tiên');clearInterval(G.tm);clearTimeout(G.adv);G.i--;nextQ()}
render();
</script></body></html>
